<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Fade & Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <nav>
    <div class="logo">Fade <span>&</span> Co.</div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signup">Sign up</a></li>
    </ul>
  </nav>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 24px;">
    <div style="width:100%;max-width:420px;">
      <div class="section-tag">Welcome back</div>
      <div class="section-title" style="margin-bottom:40px;">Log in</div>

      <div id="errorMsg" style="color:#c0392b;font-size:13px;margin-bottom:16px;display:none;"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="email" placeholder="james@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Your password">
      </div>

      <button class="btn-primary" style="width:100%;margin-top:8px;" onclick="login()">Log in</button>

      <p style="margin-top:24px;font-size:13px;color:var(--muted);text-align:center;">
        Don't have an account? <a href="/signup" style="color:var(--gold);">Sign up</a>
      </p>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.style.display = 'block';
        return;
      }

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        window.location.href = '/';
      } else {
        errorMsg.textContent = data.error;
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
